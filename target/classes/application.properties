spring.application.name=spring-ai-chat-bot-provider

# ===============================
# SERVER CONFIG
# ===============================
server.port=8080

# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/spring_ai_chat_bot_provider
spring.datasource.username=dbchecker
spring.datasource.password=dbchecker123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SWAGGER CONFIG
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# JWT CONFIG
# ===============================
app.jwt.secret=your-super-secret-key-your-super-secret-key
app.jwt.expiration=86400000

# ===============================
# OLLAMA CONFIG
# ===============================
spring.ai.ollama.base-url=http://localhost:11434
# Default model – individual chatbots can override this at runtime
spring.ai.ollama.chat.options.model=gpt-oss:120b-cloud
spring.ai.ollama.chat.options.temperature=0.7

# ===============================
# LOGGING
# ===============================
logging.level.com.learn.security=INFO
logging.level.org.springframework.security=WARN
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB